[package]
name = "dock"
version = "0.1.0"
description = "A smart dock that replaces the Windows taskbar"
edition = "2021"

[lib]
name = "dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
png = "0.17"
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
rrule = "0.14.0"
chrono-tz = "0.10.4"
keyring = { version = "3", features = ["windows-native"] }
url = "2.5.8"
notify = "8"

[target.'cfg(windows)'.dependencies]
# Same major as Tauri's own `windows` dependency so HWND types line up.
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Devices_Geolocation",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Control",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Search",
    "Win32_System_WinRT",
    "Networking_Connectivity",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
